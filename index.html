<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Il Mistero di Valdhor</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#080c12;color:#eee1c3;font-family:Georgia,serif}button,input,select{font:inherit;touch-action:manipulation}.hidden{display:none!important}.setup{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at top,#29394b,#080b10 65%);overflow:auto;padding:20px}.box{max-width:900px;margin:auto;background:#111820;border:1px solid #82683c;border-radius:16px;padding:18px}h1,h2{color:#dfb96c;text-align:center}.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hero{min-height:130px;background:#151d26;color:#eee;border:2px solid #5d4b31;border-radius:12px;padding:12px}.hero.sel{border-color:#f1c76f;box-shadow:0 0 0 2px #f1c76f55}.ico{font-size:48px;display:block}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}input,select,.btn{width:100%;min-height:48px;padding:11px;border-radius:9px;border:1px solid #765a31}.fields input,.fields select{background:#080c11;color:#fff}.btn{background:linear-gradient(#9a7134,#563917);color:#fff;font-weight:900}.app{max-width:1400px;margin:auto;padding:8px}.top,.panel{background:#10161d;border:1px solid #625035;border-radius:12px}.top{padding:10px;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center}.title{text-align:center;color:#dfb96c;font-size:34px;font-weight:900}.layout{display:grid;grid-template-columns:250px 1fr 300px;gap:8px;margin-top:8px}.panel{padding:9px}h3{color:#dfb96c;margin:4px}.castle{height:650px;position:relative;background:repeating-linear-gradient(0deg,#292d32 0 2px,#202429 2px 42px);border-radius:9px;overflow:hidden}.room{position:absolute;width:27%;height:25%;background:linear-gradient(145deg,#554b3e,#2b2721);border:2px solid #756043;border-radius:8px;display:grid;place-items:end center;padding:7px}.room.on{outline:3px solid #66b5ff}.rn{background:#000c;border-radius:20px;padding:5px;font:700 11px system-ui}.pawn{position:absolute;z-index:3;font-size:34px;transform:translate(-50%,-50%);transition:.3s}.sus,.players{font:13px system-ui}.card,.pl{padding:8px;border:1px solid #4b402e;border-radius:7px;margin:5px 0}.pl.on{outline:2px solid #dfb96c}.actions .btn{margin:4px 0}.die{display:grid;place-items:center;width:65px;height:65px;margin:10px auto;background:#eee5d2;color:#17110b;border-radius:12px;font-size:48px}.die.roll{animation:r .6s}@keyframes r{50%{transform:rotate(200deg) translateY(-18px)}100%{transform:rotate(360deg)}}.log{height:160px;overflow:auto;font:12px system-ui}.log div{padding:4px;border-bottom:1px solid #293038}.modal{position:fixed;inset:0;z-index:50;background:#000d;display:grid;place-items:center;padding:15px}.modal .box{width:min(600px,95vw)}@media(max-width:1050px){body{min-width:1080px}}</style></head><body><div id="setup" class="setup"><div class="box"><h1>IL MISTERO DI VALDHOR</h1><h2>Scegli il tuo investigatore</h2><div id="heroes" class="heroes"></div><div class="fields"><input id="name" value="Investigatore"><select id="diff"><option value="1">Facile · 1 IA</option><option value="2" selected>Normale · 2 IA</option><option value="3">Difficile · 3 IA</option></select></div><button type="button" id="startBtn" class="btn">INIZIA IL MISTERO</button></div></div><div id="app" class="app hidden"><div class="top"><div id="turn">IL TUO TURNO</div><div class="title">IL MISTERO DI VALDHOR</div><div>Colpevole · Luogo · Artefatto</div></div><div class="layout"><aside class="panel"><h3>Sospetti</h3><div id="sus" class="sus"></div></aside><main class="panel"><div id="castle" class="castle"></div><span id="die" class="die">⚀</span></main><aside class="panel"><h3>Investigatori</h3><div id="players" class="players"></div><div class="actions"><button type="button" id="rollBtn" class="btn">🎲 TIRA D6</button><button type="button" id="hypBtn" class="btn">🔍 FORMULA IPOTESI</button><button type="button" id="accBtn" class="btn">⚖️ ACCUSA FINALE</button><button type="button" id="endBtn" class="btn">FINE TURNO</button></div><h3>Log</h3><div id="log" class="log"></div></aside></div></div><div id="modal" class="modal hidden"><div class="box"><h2 id="mt"></h2><div id="mb"></div><div id="mBtns"></div></div></div><script>var S=['Kael il Cavaliere','Lyra la Maga','Eryn la Ranger','Nyx la Ladra','Doran il Paladino','Morrigan la Strega'],I=['🛡️','🔮','🏹','🗡️','⚔️','✨'],R=['Sala del Trono','Biblioteca Proibita','Cripta Reale','Torre Alchimista','Santuario','Armeria','Giardini Incantati','Sala dei Draghi','Dungeon'],W=['Lama delle Ombre','Bastone Runico','Veleno di Basilisco','Pugnale Elfico','Grimorio Maledetto','Cristallo del Caos','Martello Sacro'],P=[[3,4],[37,4],[71,4],[3,37],[37,37],[71,37],[3,70],[37,70],[71,70]],LK=[[1,3],[0,2,4],[1,5],[0,4,6],[1,3,5,7],[2,4,8],[3,7],[4,6,8],[5,7]],sel=0,G=null;function $(x){return document.getElementById(x)}function rnd(n){return Math.floor(Math.random()*n)}function face(n){return['','⚀','⚁','⚂','⚃','⚄','⚅'][n]}function heroUI(){$('heroes').innerHTML=S.map(function(s,i){return'<button type="button" class="hero '+(i===sel?'sel':'')+'" data-i="'+i+'"><span class="ico">'+I[i]+'</span><b>'+s+'</b></button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('.hero'),function(b){b.addEventListener('click',function(){sel=+this.getAttribute('data-i');heroUI()})})}heroUI();function start(){var n=+$('diff').value,ps=[{name:$('name').value||'Investigatore',h:sel,r:4,hand:[],ai:false}],o=[0,1,2,3,4,5].filter(function(x){return x!==sel}).sort(function(){return Math.random()-.5});for(var i=0;i<n;i++)ps.push({name:'IA '+(i+1),h:o[i],r:4,hand:[],ai:true});var sol={s:S[rnd(S.length)],r:R[rnd(R.length)],w:W[rnd(W.length)]},d=S.filter(x=>x!==sol.s).concat(R.filter(x=>x!==sol.r),W.filter(x=>x!==sol.w)).sort(function(){return Math.random()-.5});d.forEach(function(c,i){ps[i%ps.length].hand.push(c)});G={ps:ps,t:0,phase:'roll',moves:0,sol:sol,log:['Tre carte sono state sigillate nella Busta del Mistero.']};$('setup').classList.add('hidden');$('app').classList.remove('hidden');render()}function a(){return G.ps[G.t]}function render(){var b=$('castle');b.innerHTML='';P.forEach(function(q,i){var d=document.createElement('div');d.className='room '+(a().r===i?'on':'');d.style.left=q[0]+'%';d.style.top=q[1]+'%';d.innerHTML='<span class="rn">'+R[i]+'</span>';b.appendChild(d)});G.ps.forEach(function(p,i){var q=P[p.r],d=document.createElement('div');d.className='pawn';d.style.left=(q[0]+13+(i%2)*3)+'%';d.style.top=(q[1]+13+(i>1?3:0))+'%';d.textContent=I[p.h];b.appendChild(d)});$('sus').innerHTML=S.map((s,i)=>'<div class="card">'+I[i]+' '+s+'</div>').join('');$('players').innerHTML=G.ps.map((p,i)=>'<div class="pl '+(i===G.t?'on':'')+'">'+I[p.h]+' <b>'+p.name+'</b><br>📍 '+R[p.r]+' · 🃏 '+p.hand.length+'</div>').join('');$('turn').textContent=(a().ai?'TURNO IA · ':'IL TUO TURNO · ')+a().name;$('log').innerHTML=G.log.slice().reverse().map(x=>'<div>'+x+'</div>').join('');$('rollBtn').disabled=a().ai||G.phase!=='roll';$('endBtn').disabled=a().ai||G.phase==='roll'}function modal(t,b,opts){return new Promise(function(res){$('mt').textContent=t;$('mb').innerHTML=b;$('mBtns').innerHTML=opts.map((x,i)=>'<button type="button" class="btn" data-i="'+i+'">'+x+'</button>').join('');$('modal').classList.remove('hidden');Array.prototype.forEach.call($('mBtns').children,function(e){e.addEventListener('click',function(){$('modal').classList.add('hidden');res(opts[+this.getAttribute('data-i')])})})})}async function roll(){var n=rnd(6)+1;$('die').classList.add('roll');await new Promise(r=>setTimeout(r,600));$('die').classList.remove('roll');$('die').textContent=face(n);G.moves=Math.min(n,3);G.phase='move';G.log.push('🎲 '+a().name+' tira '+n);move()}async function move(){var opts=LK[a().r].map(i=>R[i]),x=await modal('Scegli una stanza','Passi rimasti: '+G.moves,opts);a().r=R.indexOf(x);G.moves--;G.log.push('🚪 '+a().name+' entra in '+x);render();if(G.moves>0)move();else G.phase='end'}async function hyp(){var s=await modal('Sospetto','Chi sospetti?',S),w=await modal('Artefatto','Quale artefatto?',W),rr=R[a().r],shown=null;for(var k=1;k<G.ps.length;k++){var p=G.ps[(G.t+k)%G.ps.length],m=p.hand.filter(c=>c===s||c===w||c===rr);if(m.length){shown=m[rnd(m.length)];break}}G.log.push('🔍 '+s+' · '+rr+' · '+w);await modal(shown?'Carta mostrata':'Nessuna smentita',shown?'<b>'+shown+'</b>':'Nessuno può smentire questa ipotesi.',['OK']);render()}async function accuse(){var s=await modal('Colpevole','Scegli:',S),rr=await modal('Luogo','Scegli:',R),w=await modal('Artefatto','Scegli:',W);await modal(s===G.sol.s&&rr===G.sol.r&&w===G.sol.w?'🏆 CASO RISOLTO!':'❌ ACCUSA ERRATA',s===G.sol.s&&rr===G.sol.r&&w===G.sol.w?'Hai scoperto la verità!':'La combinazione non è corretta.',['OK'])}function endTurn(){G.phase='roll';G.t=(G.t+1)%G.ps.length;render();if(a().ai)setTimeout(ai,400)}async function ai(){var p=a(),o=LK[p.r];p.r=o[rnd(o.length)];G.log.push('🤖 '+p.name+' indaga in '+R[p.r]);G.t=(G.t+1)%G.ps.length;render();if(a().ai)setTimeout(ai,400)}function bind(id,fn){var e=$(id);e.addEventListener('click',fn,false);e.addEventListener('touchend',function(ev){ev.preventDefault();fn()},false)}bind('startBtn',start);bind('rollBtn',roll);bind('hypBtn',hyp);bind('accBtn',accuse);bind('endBtn',endTurn);</script></body></html>
