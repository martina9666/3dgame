<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Il Mistero di Valdhor</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#05080d;color:#eee0bf;font-family:Georgia,serif}button,input,select{font:inherit;touch-action:manipulation}.hide{display:none!important}.app{max-width:1500px;margin:auto;padding:6px}.bar,.p{background:#0b1118f4;border:1px solid #72562d;border-radius:10px}.bar{height:64px;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:8px 12px}.ttl{text-align:center;color:#e1b663;font-size:34px;font-weight:900}.grid{display:grid;grid-template-columns:250px 1fr 315px;gap:6px;margin-top:6px}.p{padding:8px}h2,h3{color:#e1b663;margin:0 0 7px}.card,.pl{padding:8px;border:1px solid #544328;border-radius:7px;margin:5px;background:#0b1016}.pl.on{outline:2px solid #dfb564}.castle{position:relative;aspect-ratio:885/790;background:#090c10 url('https://raw.githubusercontent.com/martina9666/3dgame/valdhorr/assets/castello-valdhor.webp') center/cover no-repeat;border:1px solid #765a30;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 50px #000}.room{position:absolute;border:2px solid transparent;background:transparent;border-radius:8px;z-index:2}.room.go{border-color:#70e36b;box-shadow:0 0 25px #6fe66c;background:#65e65c12}.room.now{border-color:#5ab4ff;box-shadow:0 0 22px #55aaff}.room span{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);background:#000c;padding:3px 6px;border-radius:20px;font:700 9px system-ui;color:#f1d8a1;white-space:nowrap}.pawn{position:absolute;z-index:5;width:40px;height:50px;transform:translate(-50%,-70%);border:2px solid #e0b663;border-radius:50% 50% 30% 30%;background:#1e2833;display:grid;place-items:center;font-weight:bold;box-shadow:0 5px 12px #000;transition:.3s}.pawn.me:after{content:'';position:absolute;bottom:-8px;width:35px;height:10px;border:3px solid #5ab4ff;border-radius:50%}.die{display:grid;place-items:center;width:64px;height:64px;margin:8px auto;background:#eee4d0;color:#17110a;border-radius:12px;font-size:46px}.die.r{animation:r .6s}@keyframes r{50%{transform:rotate(200deg) translateY(-16px)}100%{transform:rotate(360deg)}}.btn{width:100%;min-height:45px;margin:3px 0;border:1px solid #806033;border-radius:8px;background:linear-gradient(#684522,#382516);color:#fff;font-weight:900}.blue{background:linear-gradient(#4779a8,#294967)}.purple{background:linear-gradient(#704581,#3c2748)}.log{height:150px;overflow:auto;font:11px system-ui;border-top:1px solid #413624}.log div{padding:3px;border-bottom:1px solid #252b32}.setup{position:fixed;inset:0;z-index:30;background:#000e;display:grid;place-items:center;padding:15px}.box{width:min(800px,96vw);max-height:92vh;overflow:auto;background:#101720;border:1px solid #846538;border-radius:14px;padding:15px}.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pick button{min-height:75px;background:#121a23;color:#eee;border:1px solid #5b482b;border-radius:8px}.pick button.sel{outline:2px solid #e0b563}input,select{width:100%;padding:11px;margin:5px 0;background:#080c11;color:white;border:1px solid #59472b;border-radius:7px}@media(max-width:1050px){body{min-width:1100px}}</style></head><body><div id="setup" class="setup"><div class="box"><h2 style="text-align:center">IL MISTERO DI VALDHOR</h2><div id="pick" class="pick"></div><input id="name" value="Investigatore"><select id="diff"><option value="1">Facile · 1 IA</option><option value="2" selected>Normale · 2 IA</option><option value="3">Difficile · 3 IA</option></select><button id="start" class="btn">INIZIA LA PARTITA</button></div></div><div id="game" class="app hide"><div class="bar"><div id="turn">IL TUO TURNO</div><div class="ttl">IL MISTERO DI VALDHOR</div><div style="text-align:right">Colpevole · Luogo · Artefatto</div></div><div class="grid"><aside class="p"><h2>Sospetti</h2><div id="sus"></div></aside><main class="p"><div id="castle" class="castle"></div><span id="die" class="die">⚀</span><div id="event" style="text-align:center">Esplora il castello.</div></main><aside class="p"><h2>Investigatori</h2><div id="players"></div><button id="roll" class="btn blue">🎲 TIRA D6</button><button id="hyp" class="btn purple">🔍 FAI UN'IPOTESI</button><button id="acc" class="btn">⚖️ ACCUSA FINALE</button><button id="end" class="btn">FINE TURNO</button><h3>Log</h3><div id="log" class="log"></div></aside></div></div><script>const H=['Kael','Lyra','Eryn','Nyx','Doran','Morrigan'],HN=['Kael il Cavaliere','Lyra la Maga','Eryn la Ranger','Nyx la Ladra','Doran il Paladino','Morrigan la Strega'],R=['Biblioteca Proibita','Sala del Trono','Torre dell’Alchimista','Armeria','Sala Centrale','Santuario','Cripta Reale','Dungeon','Giardini Incantati','Sala dei Draghi'],W=['Lama delle Ombre','Bastone Runico','Veleno di Basilisco','Pugnale Elfico','Grimorio Maledetto','Cristallo del Caos','Martello Sacro'],P=[[11,12,23,24],[35,7,30,26],[70,11,23,23],[8,36,24,24],[36,32,30,27],[70,36,23,23],[8,66,23,25],[34,70,18,20],[53,70,20,20],[75,67,22,23]],L=[[1,3,4],[0,2,4],[1,4,5],[0,4,6],[0,1,2,3,5,6,7,8,9],[2,4,9],[3,4,7],[4,6,8],[4,7,9],[4,5,8]];let sel=0,G=null,$=x=>document.getElementById(x),rnd=n=>Math.floor(Math.random()*n),face=n=>['','⚀','⚁','⚂','⚃','⚄','⚅'][n];function picks(){$('pick').innerHTML=HN.map((h,i)=>`<button data-i="${i}" class="${i==sel?'sel':''}"><b>${h}</b></button>`).join('');document.querySelectorAll('#pick button').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;picks()})}picks();function start(){let n=+$('diff').value,o=H.map((_,i)=>i).filter(i=>i!=sel).sort(()=>Math.random()-.5),ps=[{n:$('name').value||'Investigatore',h:sel,r:4,ai:false}];for(let i=0;i<n;i++)ps.push({n:'IA '+(i+1),h:o[i],r:4,ai:true});G={ps,t:0,phase:'roll',moves:0,sol:[rnd(6),rnd(10),rnd(7)],log:['Tre carte sono state sigillate nella Busta del Mistero.']};$('setup').classList.add('hide');$('game').classList.remove('hide');render()}function a(){return G.ps[G.t]}function render(){let b=$('castle');b.innerHTML='';P.forEach((p,i)=>{let d=document.createElement('button');d.className='room '+(a().r==i?'now ':'')+(G.phase=='move'&&!a().ai&&L[a().r].includes(i)?'go':'');d.style.left=p[0]+'%';d.style.top=p[1]+'%';d.style.width=p[2]+'%';d.style.height=p[3]+'%';d.innerHTML=`<span>${R[i]}</span>`;d.onclick=()=>move(i);b.appendChild(d)});G.ps.forEach((p,i)=>{let q=P[p.r],d=document.createElement('div');d.className='pawn '+(!p.ai?'me':'');d.style.left=(q[0]+q[2]/2+(i%2)*3)+'%';d.style.top=(q[1]+q[3]*.62)+'%';d.textContent=H[p.h][0];b.appendChild(d)});$('sus').innerHTML=HN.map(x=>`<div class="card"><b>${x}</b></div>`).join('');$('players').innerHTML=G.ps.map((p,i)=>`<div class="pl ${i==G.t?'on':''}"><b>${p.n}</b> · ${HN[p.h]}<br>📍 ${R[p.r]}</div>`).join('');$('turn').textContent=(a().ai?'TURNO IA · ':'IL TUO TURNO · ')+a().n;$('log').innerHTML=G.log.slice().reverse().map(x=>`<div>${x}</div>`).join('')}async function roll(){if(a().ai||G.phase!='roll')return;let n=rnd(6)+1;$('die').classList.add('r');setTimeout(()=>{$('die').classList.remove('r');$('die').textContent=face(n)},600);G.moves=Math.min(n,4);G.phase='move';G.log.push('🎲 '+a().n+' tira '+n);$('event').textContent='Tocca una stanza evidenziata in verde.';render()}function move(i){if(G.phase!='move'||!L[a().r].includes(i)||a().ai)return;a().r=i;G.moves--;G.log.push('🚪 '+a().n+' entra in '+R[i]);if(G.moves<=0)G.phase='end';render()}function hyp(){let h=prompt('Chi sospetti?\n'+HN.map((x,i)=>(i+1)+'. '+x).join('\n'));if(!h)return;let w=prompt('Quale artefatto?\n'+W.map((x,i)=>(i+1)+'. '+x).join('\n'));if(!w)return;G.log.push('🔍 Ipotesi in '+R[a().r]+': '+HN[(+h-1)||0]+' · '+W[(+w-1)||0]);alert(Math.random()<.7?'Un investigatore ti mostra una carta che smentisce l’ipotesi.':'Nessuno può smentire questa ipotesi.');render()}function acc(){let h=+prompt('Numero del colpevole 1-6')-1,r=+prompt('Numero del luogo 1-10')-1,w=+prompt('Numero artefatto 1-7')-1;alert(h==G.sol[0]&&r==G.sol[1]&&w==G.sol[2]?'🏆 CASO RISOLTO!':'❌ Accusa errata.')}function end(){G.phase='roll';G.t=(G.t+1)%G.ps.length;render();if(a().ai)setTimeout(ai,450)}function ai(){let p=a(),o=L[p.r];p.r=o[rnd(o.length)];G.log.push('🤖 '+p.n+' indaga in '+R[p.r]);G.t=(G.t+1)%G.ps.length;render();if(a().ai)setTimeout(ai,450)}function bind(id,fn){let e=$(id),lock=false;e.onclick=()=>{if(!lock)fn()};e.ontouchend=v=>{v.preventDefault();lock=true;fn();setTimeout(()=>lock=false,350)}}bind('start',start);bind('roll',roll);bind('hyp',hyp);bind('acc',acc);bind('end',end);</script></body></html>
